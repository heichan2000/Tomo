name: tomo_core
description: "Tomo's rules, storage and art. Plain Dart: no Flutter, no Riverpod, no plugins (ADR-0027)."
publish_to: 'none'
version: 0.0.0

environment:
  sdk: ^3.13.0

resolution: workspace

# No Flutter here, on purpose: a Flutter import in this package must fail to
# compile (ADR-0027).
dependencies:
  drift: ^2.35.2

dev_dependencies:
  build_runner: ^2.16.1
  crypto: ^3.0.7
  drift_dev: ^2.35.1
  mocktail: ^1.0.5
  test: any
